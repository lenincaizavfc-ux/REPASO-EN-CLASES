<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de registro accesible</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>
    <form id="registro" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required minlength="3"
               aria-describedby="nombre-error">
        <span id="nombre-error" class="mensaje-error" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required
               aria-describedby="correo-error">
        <span id="correo-error" class="mensaje-error" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required
               pattern="[0-9]{10}" placeholder="0999999999"
               aria-describedby="telefono-error">
        <span id="telefono-error" class="mensaje-error" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="8"
               aria-describedby="clave-error">
        <span id="clave-error" class="mensaje-error" aria-live="polite"></span>
      </div>

      <div class="campo campo-checkbox">
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
        <span id="terminos-error" class="mensaje-error" aria-live="polite"></span>
      </div>

      <button type="submit">Crear cuenta</button>
      <p id="mensajeExito" class="mensaje-exito" aria-live="polite"></p>
    </form>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
